#terraform-module-struscture14082026

trigger: none

pool:
  vmImage: 'ubuntu-latest'

#####################################STAGE1#############################
stages:
  - stage: terraform_modular_structure_terraform
    jobs:
      - job: terraform_modular_structure
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.15.8'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/parent_modules/dev'
              backendServiceArm: 'Azure subscription 1(2530114a-1411-4234-ad42-e376b6598826)'
              backendAzureRmStorageAccountName: 'tfpipelinestg14082026'
              backendAzureRmContainerName: 'tfpipelinecontainer1914'
              backendAzureRmKey: 'pipeline.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/parent_modules/dev'
              environmentServiceNameAzureRM: 'Azure subscription 1(2530114a-1411-4234-ad42-e376b6598826)'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-auto-approve'
              workingDirectory: '$(System.DefaultWorkingDirectory)/parent_modules/dev'
              environmentServiceNameAzureRM: 'Azure subscription 1(2530114a-1411-4234-ad42-e376b6598826)'
